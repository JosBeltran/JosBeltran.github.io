<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JBU — Josue Beltran Uresti</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@carbon/styles@1/css/styles.min.css">
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <style>
        /* Header Minimalista Superior */
        .gallery-header {
            padding: 1rem 2rem;
            border-bottom: 1px solid #eaeaea;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .brand-name-header {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #111;
            text-decoration: none;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            position: relative;
        }

        .btn-login {
            font-size: 0.8rem;
            font-weight: 500;
            color: #111;
            text-decoration: none;
            padding: 0.4rem 0.9rem;
            border: 1px solid #111;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: #111;
            color: #fff;
        }

        .waffle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .waffle-btn:hover {
            background: #f4f4f4;
        }

        .waffle-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 220px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-radius: 8px;
            padding: 0.5rem 0;
            z-index: 101;
        }

        .waffle-dropdown.active {
            display: block;
        }

        .waffle-menu-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .waffle-menu-item a {
            display: block;
            padding: 0.7rem 1.2rem;
            color: #222;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .waffle-menu-item a:hover {
            background: #f7f7f7;
        }

        /* Sección del Logo Central Grande */
        .hero-brand-area {
            text-align: center;
            padding: 2.5rem 1rem 1rem 1rem;
        }

        .hero-main-logo {
            max-height: 200px; /* Logo más grande y amplio */
            max-width: 280px;
            width: auto;
            display: inline-block;
            object-fit: contain;
        }

        /* Filtros estrictamente en 1 SOLA LÍNEA */
        .catalog-toolbar-editorial {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0.75rem !important;
            margin: 1.5rem auto 2.5rem auto !important;
            max-width: 1000px !important;
            padding: 0 1.5rem !important;
            width: 100%;
        }

        .filter-select, .filter-input {
            background: #ffffff !important;
            color: #222 !important;
            border: 1px solid #ddd !important;
            padding: 0.6rem 0.8rem !important;
            font-size: 0.82rem !important;
            border-radius: 4px !important;
            outline: none;
            flex: 1 1 auto !important;
            min-width: 0 !important; /* Permite que se mantengan en una sola línea en pantallas medianas */
            height: 38px;
            box-sizing: border-box;
        }

        .filter-input {
            flex: 1.5 1 auto !important;
        }

        .filter-select:focus, .filter-input:focus {
            border-color: #111 !important;
        }

        /* Responsive: si la pantalla es móvil, permite wrap para no romper usabilidad */
        @media (max-width: 768px) {
            .catalog-toolbar-editorial {
                flex-wrap: wrap !important;
            }
            .filter-select, .filter-input {
                min-width: 100% !important;
            }
        }

        /* Grid de Obras Redimensionadas */
        .editorial-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)) !important;
            gap: 2rem 1.5rem;
            max-width: 1320px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .artwork-card img, 
        .editorial-gallery-grid img {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            background: #fafafa;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }

        .artwork-card img:hover,
        .editorial-gallery-grid img:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="editorial-gallery-body">

    <!-- HEADER MINIMALISTA -->
    <header class="gallery-header" role="banner">
        <div class="header-container">
            
            <div class="header-left">
                <a href="index.html" class="brand-name-header">Josue Beltran Uresti</a>
            </div>

            <div class="header-right">
                <a href="#" id="btnAuth" class="btn-login">Sign In</a>

                <button class="waffle-btn" id="waffleToggle" aria-label="Open menu" aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="4" height="4" rx="1" fill="#111111"/>
                        <rect x="8" y="2" width="4" height="4" rx="1" fill="#111111"/>
                        <rect x="14" y="2" width="4" height="4" rx="1" fill="#111111"/>
                        <rect x="2" y="8" width="4" height="4" rx="1" fill="#111111"/>
                        <rect x="8" y="8" width="4" height="4" rx="1" fill="#111111"/>
                        <rect x="14" y="8" width="4" height="4" rx="1" fill="#111111"/>
                        <rect x="2" y="14" width="4" height="4" rx="1" fill="#111111"/>
                        <rect x="8" y="14" width="4" height="4" rx="1" fill="#111111"/>
                        <rect x="14" y="14" width="4" height="4" rx="1" fill="#111111"/>
                    </svg>
                </button>

                <!-- Dropdown Waffle Menu -->
                <nav class="waffle-dropdown" id="waffleDropdown" aria-label="Main menu">
                    <ul class="waffle-menu-list">
                        <li class="waffle-menu-item"><a href="index.html" style="font-weight: 700;">● Original Art</a></li>
                        <li class="waffle-menu-item"><a href="cases.html">Case Devices</a></li>
                        <li class="waffle-menu-item"><a href="art-objects.html">Art Objects</a></li>
                        <li class="waffle-menu-item"><a href="info/soporte.html">Support / Contact</a></li>
                    </ul>
                </nav>
            </div>

        </div>
    </header>

    <main class="editorial-layout-wrapper">
        
        <!-- LOGO PROTAGONISTA MÁS GRANDE -->
        <section class="hero-brand-area">
            <img class="hero-main-logo" src="assets/logoXL.png" alt="Josue Beltran Uresti Studio Logo">
        </section>

        <!-- FILTROS EN 1 SOLA LÍNEA HORIZONTAL -->
        <div class="catalog-toolbar-editorial">
            <select id="filterSeries" class="filter-select">
                <option value="ALL">All Series</option>
                <option value="ORIGINALES">Originals</option>
            </select>
            <select id="filterStatus" class="filter-select">
                <option value="ALL">All Status</option>
                <option value="AVAILABLE">Available</option>
                <option value="SOLD">Sold</option>
            </select>
            <select id="sortOrder" class="filter-select">
                <option value="DEFAULT">Sort By</option>
                <option value="PRICE_ASC">Price: Low to High</option>
                <option value="PRICE_DESC">Price: High to Low</option>
            </select>
            <input type="text" id="filterSearch" class="filter-input" placeholder="Search artwork...">
        </div>

        <!-- GRID DE OBRAS (MÁS COMPACTO Y PROPORCIONADO) -->
        <section class="catalog-main-area">
            <div id="codeGrid" class="editorial-gallery-grid"></div>

            <div id="loadMoreContainer" style="text-align: center; margin-top: 3rem; display: none;">
                <button id="btnLoadMore" style="padding: 0.7rem 1.8rem; background: #111; color: #fff; border: none; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; border-radius: 4px;">
                    Load More Artworks
                </button>
            </div>
        </section>
    </main>

    <footer class="gallery-footer" role="contentinfo" style="margin-top: 4rem; padding: 2rem 0; border-top: 1px solid #eaeaea;">
        <div class="footer-inner" style="display: flex; justify-content: space-between; align-items: center; max-width: 1320px; margin: 0 auto; padding: 0 1.5rem;">
            <span class="footer-copyright" style="font-size: 0.85rem; color: #666;">© 2026 JBU. All rights reserved.</span>
            <div class="footer-utility-links" style="display: flex; gap: 1.5rem; font-size: 0.85rem;">
                <a href="info/terminos-de-servicio.html" style="color: #444; text-decoration: none;">Terms</a>
                <a href="info/politica-de-privacidad.html" style="color: #444; text-decoration: none;">Privacy</a>
            </div>
        </div>
    </footer>

    <!-- LIGHTBOX MODAL -->
    <div id="artwork-lightbox" class="lightbox-modal" role="dialog" aria-hidden="true">
        <button id="lightbox-close" class="lightbox-btn-close" aria-label="Close viewer">&times;</button>
        <div class="lightbox-stage">
            <button id="lightbox-prev" class="lightbox-nav-btn prev-btn" aria-label="Previous artwork">&#10094;</button>
            <div class="lightbox-content">
                <img id="lightbox-img" src="" alt="Expanded artwork" />
                <div class="lightbox-caption">
                    <h3 id="lightbox-title">—</h3>
                    <p id="lightbox-specs">—</p>
                    <a id="lightbox-cta" href="#" class="lightbox-cta-btn">Inquire / Details</a>
                </div>
            </div>
            <button id="lightbox-next" class="lightbox-nav-btn next-btn" aria-label="Next artwork">&#10095;</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const waffleBtn = document.getElementById('waffleToggle');
            const waffleDropdown = document.getElementById('waffleDropdown');

            waffleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isExpanded = waffleBtn.getAttribute('aria-expanded') === 'true';
                waffleBtn.setAttribute('aria-expanded', !isExpanded);
                waffleDropdown.classList.toggle('active');
            });

            document.addEventListener('click', (e) => {
                if (!waffleDropdown.contains(e.target) && !waffleBtn.contains(e.target)) {
                    waffleDropdown.classList.remove('active');
                    waffleBtn.setAttribute('aria-expanded', 'false');
                }
            });
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
