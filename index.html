<!DOCTYPE html>
<html lang="es" data-theme="white">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JBU — Josue Beltran Uresti</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@carbon/styles@1/css/styles.min.css">
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="assets/logo.png" />

</head>
<body class="editorial-gallery-body">

    <header class="gallery-header" role="banner">
        <div class="header-container">
            <a class="gallery-brand" href="index.html" aria-label="JBU - Volver al inicio">
                <img class="logo-clean" id="logo" src="assets/logo.png" alt="Firma JBU">
                <div class="brand-text-block">
                    <span class="brand-prefix">ART VAULT</span>
                    <span class="brand-suffix">Galería & Archivo</span>
                </div>
            </a>
            
            <nav class="gallery-nav" aria-label="Navegación principal">
                <ul class="nav-menu" role="menubar">
                    <li role="none"><a class="nav-link" href="index.html" role="menuitem" style="font-weight: 600; color: #111;">Originales</a></li>
                    <li role="none"><a class="nav-link" href="cases.html" role="menuitem">Case Devices</a></li>
                    <li role="none"><a class="nav-link" href="info/soporte.html" role="menuitem">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="editorial-layout-wrapper">
        <section class="catalog-main-area">
            
            <div class="catalog-header-block">
                <span class="metadata-label" style="text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; color: #888; font-weight: 600;">ARCHIVO DE OBRA</span>
                <h3 class="catalog-section-title" style="font-size: 1.5rem; margin-top: 0.2rem; margin-bottom: 0.3rem;">Josue Beltran Uresti</h3>
                <p class="catalog-subtitle" style="color: #666; font-size: 0.88rem; margin: 0;">Explora las obras de arte originales y sus colecciones correspondientes.</p>
            </div>

            <div class="catalog-toolbar-editorial">
                <div>
                    <select id="filterSeries" class="filter-select">
                        <option value="ALL">Todas las series</option>
                        <option value="ORIGINALES">Originales</option>
                    </select>
                </div>
                <div>
                    <select id="filterStatus" class="filter-select">
                        <option value="ALL">Cualquier estatus</option>
                        <option value="AVAILABLE">Disponible</option>
                        <option value="SOLD">Vendido</option>
                    </select>
                </div>
                <div>
                    <select id="sortOrder" class="filter-select">
                        <option value="DEFAULT">Ordenar por</option>
                        <option value="PRICE_ASC">Precio: Menor a Mayor</option>
                        <option value="PRICE_DESC">Precio: Mayor a Menor</option>
                    </select>
                </div>
                <div>
                    <input type="text" id="filterSearch" class="filter-input" placeholder="Buscar obra...">
                </div>
            </div>

            <div id="codeGrid" class="editorial-gallery-grid"></div>

            <div id="loadMoreContainer" style="text-align: center; margin-top: 2.5rem; display: none;">
                <button id="btnLoadMore" style="padding: 0.8rem 2rem; background: #111; color: #fff; border: none; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;">
                    Cargar Más Obras
                </button>
            </div>

        </section>
    </main>

    <footer class="gallery-footer" role="contentinfo" style="margin-top: 4rem; padding: 2rem 0; border-top: 1px solid #eaeaea;">
        <div class="footer-inner" style="display: flex; justify-content: space-between; align-items: center; max-width: 1320px; margin: 0 auto; padding: 0 1.5rem;">
            <span class="footer-copyright" style="font-size: 0.85rem; color: #666;">© 2026 JBU. Todos los derechos reservados.</span>
            <div class="footer-utility-links" style="display: flex; gap: 1.5rem; font-size: 0.85rem;">
                <a href="info/terminos-de-servicio.html" style="color: #444; text-decoration: none;">Términos</a>
                <a href="info/politica-de-privacidad.html" style="color: #444; text-decoration: none;">Privacidad</a>
            </div>
        </div>
    </footer>

    <div id="artwork-lightbox" class="lightbox-modal" role="dialog" aria-hidden="true">
        <button id="lightbox-close" class="lightbox-btn-close" aria-label="Cerrar visualizador">&times;</button>
        <div class="lightbox-stage">
            <button id="lightbox-prev" class="lightbox-nav-btn prev-btn" aria-label="Obra anterior">&#10094;</button>
            <div class="lightbox-content">
                <img id="lightbox-img" src="" alt="Obra ampliada" />
                <div class="lightbox-caption">
                    <h3 id="lightbox-title">—</h3>
                    <p id="lightbox-specs">—</p>
                    <a id="lightbox-cta" href="#" class="lightbox-cta-btn">Consultar / Ficha Técnica</a>
                </div>
            </div>
            <button id="lightbox-next" class="lightbox-nav-btn next-btn" aria-label="Siguiente obra">&#10095;</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
